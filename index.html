<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Travel Architect v4.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f1f5f9; 
            --danger: #ef4444; --success: #22c55e; 
            --transport-bg: #451a03; --transport-border: #f59e0b;
            --hotel-bg: #312e81; --hotel-border: #818cf8;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* 共用元件 */
        .btn { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-outline { background: transparent; border: 1px solid #475569; color: #94a3b8; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-sm { padding: 4px 8px; font-size: 0.8rem; }

        input, select { background: #020617; border: 1px solid #334155; color: white; padding: 8px; border-radius: 4px; outline: none; }
        input:focus { border-color: var(--accent); }

        /* --- 畫面 1: 旅程大廳 --- */
        #view-lobby { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; padding-top: 50px; overflow-y: auto; }
        .trip-card { background: var(--panel); width: 320px; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; position: relative; transition: 0.2s; }
        .trip-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .trip-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .trip-card-actions { display: flex; justify-content: flex-end; gap: 5px; margin-top: 15px; }

        /* --- 畫面 2: 編輯器 --- */
        #view-editor { display: none; width: 100%; height: 100%; }
        #sidebar { width: 450px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.3); }
        
        .navbar { padding: 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #020617; }
        .content-area { flex: 1; overflow-y: auto; padding: 15px; }

        /* --- 輸入表單區 --- */
        .edit-panel { background: #263344; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .form-row > * { flex: 1; }
        
        /* --- 時間軸樣式 --- */
        .day-container { margin-bottom: 40px; }
        .day-header { 
            position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px);
            padding: 10px; border-bottom: 2px solid var(--accent); z-index: 10; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .day-date-input { background: transparent; border: none; color: var(--accent); font-weight: bold; font-family: 'Inter', sans-serif; font-size: 1rem; cursor: pointer; }

        .timeline { position: relative; padding-left: 20px; border-left: 2px solid #334155; margin-left: 10px; }

        /* 一般景點卡片 */
        .item-card { 
            position: relative; margin-bottom: 15px; padding: 12px; 
            background: #1e293b; border-radius: 8px; border: 1px solid #475569;
            transition: 0.2s; cursor: grab; display: flex; justify-content: space-between;
        }
        .item-card:hover { border-color: #94a3b8; }
        
        /* 住宿卡片 */
        .item-card.type-hotel { background: var(--hotel-bg); border-color: var(--hotel-border); }
        .item-card.type-hotel .item-icon { background: var(--hotel-border); }

        /* 交通卡片 (車票樣式) */
        .item-transport { 
            position: relative; margin: 20px 0; padding: 10px 15px; 
            background: var(--transport-bg); border: 1px dashed var(--transport-border); 
            border-radius: 4px; color: #fbbf24; cursor: grab;
        }
        .transport-route { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .transport-meta { display: flex; gap: 15px; font-size: 0.85rem; opacity: 0.9; }
        .transport-icon { position: absolute; left: -34px; top: 50%; transform: translateY(-50%); background: var(--bg); border: 1px solid var(--transport-border); color: var(--transport-border); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 5; }

        /* 時間軸小圓點 */
        .timeline-dot {
            position: absolute; left: -27px; top: 18px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--bg); border: 2px solid #64748b; z-index: 2;
        }
        .type-hotel .timeline-dot { border-color: #818cf8; background: #818cf8; }

        #map { flex: 1; height: 100%; }
        
        /* 分類標籤 */
        .cat-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #334155; margin-left: 5px; vertical-align: middle; }

    </style>
</head>
<body>

    <div id="view-lobby">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="color:var(--accent); margin:0; font-size:2rem;">TRAVEL ARCHITECT</h1>
            <p style="color:#64748b; margin-top:5px;">Professional v4.0</p>
            <div style="margin-top:15px; font-size:0.9rem;">
                <img id="user-avatar" src="" style="width:24px; height:24px; border-radius:50%; vertical-align:middle;">
                <span id="user-name" style="margin: 0 10px;">Guest</span>
                <button onclick="logout()" class="btn btn-outline btn-sm">登出</button>
            </div>
        </div>

        <div style="width: 320px; margin-bottom: 20px;">
            <button onclick="createNewTrip()" class="btn btn-primary" style="width:100%; margin-bottom:10px;">+ 建立新旅程</button>
            <div style="display:flex; gap:5px;">
                <input type="text" id="join-code" placeholder="輸入邀請碼 ID" style="flex:1;">
                <button onclick="joinTrip()" class="btn btn-outline">加入</button>
            </div>
        </div>

        <h3 style="color:#94a3b8; width:320px; margin-bottom:10px; font-size:0.9rem;">我的旅程列表</h3>
        <div id="trip-list"></div>
    </div>

    <div id="view-editor">
        <div id="sidebar">
            <div class="navbar">
                <button class="btn btn-outline btn-sm" onclick="backToLobby()"><i class="fas fa-chevron-left"></i> 回大廳</button>
                <div style="text-align:right;">
                    <div id="trip-title" style="font-weight:bold;">Trip Title</div>
                    <div id="trip-id-display" onclick="copyTripId()" style="font-size:0.7em; color:var(--accent); cursor:pointer;">ID: LOADING</div>
                </div>
            </div>

            <div class="content-area">
                
                <div class="edit-panel">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-size:0.9rem; font-weight:bold; color:var(--accent);">新增項目</span>
                        <button class="btn btn-outline btn-sm" onclick="addCustomCategory()">+ 自訂類別</button>
                    </div>

                    <div class="form-row">
                        <select id="new-type" onchange="toggleFormFields()" style="flex:1;">
                            <option value="sight">📍 一般景點</option>
                            <option value="food">🍜 美食餐廳</option>
                            <option value="shopping">🛍️ 購物行程</option>
                            <option value="hotel">🏨 住宿飯店</option>
                            <option value="transport">🚅 交通移動</option>
                        </select>
                    </div>

                    <div id="form-general">
                        <div class="form-row">
                            <input type="text" id="new-name" placeholder="名稱 (例如: 清水寺)" style="flex:2;">
                            <input type="time" id="new-time" style="flex:1;">
                        </div>
                        <div class="form-row">
                            <button class="btn btn-outline" style="width:100%" onclick="searchPlace()">
                                <i class="fas fa-map-marker-alt"></i> 搜尋並定位
                            </button>
                        </div>
                    </div>

                    <div id="form-transport" style="display:none;">
                        <div class="form-row">
                            <input type="text" id="trans-from" placeholder="出發站 (例: 京都)" style="flex:1;">
                            <i class="fas fa-arrow-right" style="padding-top:10px; color:#64748b;"></i>
                            <input type="text" id="trans-to" placeholder="抵達站 (例: 大阪)" style="flex:1;">
                        </div>
                        <div class="form-row">
                            <input type="number" id="trans-duration" placeholder="耗時 (分鐘)" style="flex:1;">
                            <input type="number" id="trans-price" placeholder="票價 (選填)" style="flex:1;">
                        </div>
                    </div>

                    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addItem()">加入行程</button>
                </div>

                <div id="timeline-container"></div>
                
                <div style="text-align:center; padding-top:20px; padding-bottom:50px;">
                    <button class="btn btn-outline" style="width:100%" onclick="addDay()">+ 新增天數</button>
                </div>

            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyBzNnKXVglsGckbt4YK1MzMUqEapXaMqNw",
          authDomain: "travel-plan-1.firebaseapp.com",
          projectId: "travel-plan-1",
          storageBucket: "travel-plan-1.firebasestorage.app",
          messagingSenderId: "623643684132",
          appId: "1:623643684132:web:214e3cdd6289b0056657b1",
          measurementId: "G-HLX5TQ4VMW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentTripId = null;
        let currentTripData = null;
        let mapObj = null;
        let mapMarkers = {};
        let tempLat = null, tempLng = null;

        // --- 初始化地圖 ---
        function initMap() {
            if(mapObj) return;
            mapObj = L.map('map').setView([35.689, 139.692], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(mapObj);
        }

        // --- Auth ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
                loadLobby();
            } else {
                signInWithPopup(auth, provider);
            }
        });
        window.logout = () => signOut(auth);

        // =======================
        // 1. 大廳邏輯 (Lobby)
        // =======================

        function loadLobby() {
            document.getElementById('view-lobby').style.display = 'flex';
            document.getElementById('view-editor').style.display = 'none';
            
            const q = query(collection(db, "trips"), where("members", "array-contains", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('trip-list');
                list.innerHTML = '';
                if(snapshot.empty) return list.innerHTML = '<div style="text-align:center;color:#666">尚無旅程</div>';

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'trip-card';
                    div.innerHTML = `
                        <div class="trip-card-header" onclick="enterTrip('${doc.id}')" style="cursor:pointer">
                            <div>
                                <div style="font-weight:bold; font-size:1.1rem; color:#fff">${data.name}</div>
                                <div style="font-size:0.8rem; color:#64748b;">${data.days.length} 天 • ${data.members.length} 人</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color:#64748b"></i>
                        </div>
                        <div class="trip-card-actions">
                             <button class="btn btn-danger btn-sm" onclick="deleteTrip('${doc.id}')">刪除旅程</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        window.enterTrip = (id) => {
            currentTripId = id;
            document.getElementById('view-lobby').style.display = 'none';
            document.getElementById('view-editor').style.display = 'flex';
            initMap();
            mapObj.invalidateSize();
            document.getElementById('trip-id-display').innerText = `ID: ${id}`;
            
            onSnapshot(doc(db, "trips", id), (docSnap) => {
                if(docSnap.exists()) {
                    currentTripData = docSnap.data();
                    document.getElementById('trip-title').innerText = currentTripData.name;
                    updateCategorySelect(); // 更新下拉選單
                    renderTimeline();
                } else {
                    alert("旅程已被刪除");
                    backToLobby();
                }
            });
        };

        window.backToLobby = () => { currentTripId = null; loadLobby(); };

        window.createNewTrip = async () => {
            const name = prompt("旅程名稱:");
            if(!name) return;
            const newId = 'TRIP-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            await setDoc(doc(db, "trips", newId), {
                name: name,
                members: [currentUser.uid],
                categories: ['sight:景點', 'food:美食', 'shopping:購物', 'hotel:住宿', 'transport:交通'], // 預設類別
                days: [{ id: 'day1', date: '', items: [] }],
                expenses: []
            });
        };

        window.joinTrip = async () => {
            const code = document.getElementById('join-code').value;
            if(!code) return alert("請輸入代碼");
            const ref = doc(db, "trips", code);
            const snap = await getDoc(ref);
            if(snap.exists()) {
                await updateDoc(ref, { members: arrayUnion(currentUser.uid) });
                enterTrip(code);
            } else { alert("查無此旅程"); }
        };

        window.deleteTrip = async (id) => {
            if(confirm("⚠️ 警告：確定要永久刪除此旅程嗎？所有成員都將無法查看。")) {
                await deleteDoc(doc(db, "trips", id));
            }
        };

        // =======================
        // 2. 編輯器邏輯 (Editor)
        // =======================

        // --- 類別管理 ---
        window.addCustomCategory = async () => {
            const name = prompt("輸入新類別名稱 (例: 滑雪):");
            if(!name) return;
            const newCat = `custom-${Date.now()}:${name}`;
            const updatedCats = [...(currentTripData.categories || []), newCat];
            await updateDoc(doc(db, "trips", currentTripId), { categories: updatedCats });
        };

        function updateCategorySelect() {
            const select = document.getElementById('new-type');
            select.innerHTML = '';
            const cats = currentTripData.categories || ['sight:景點', 'transport:交通'];
            
            cats.forEach(c => {
                const [val, label] = c.split(':');
                const opt = document.createElement('option');
                opt.value = val;
                opt.innerText = label;
                select.appendChild(opt);
            });
            // 觸發一次 UI 更新
            toggleFormFields();
        }

        // --- 表單切換 ---
        window.toggleFormFields = () => {
            const type = document.getElementById('new-type').value;
            if(type.includes('transport')) {
                document.getElementById('form-general').style.display = 'none';
                document.getElementById('form-transport').style.display = 'block';
            } else {
                document.getElementById('form-general').style.display = 'block';
                document.getElementById('form-transport').style.display = 'none';
            }
        };

        // --- 新增項目 ---
        window.addItem = async () => {
            const type = document.getElementById('new-type').value;
            let newItem = { id: crypto.randomUUID(), type: type, lat: tempLat, lng: tempLng };

            if(type.includes('transport')) {
                const from = document.getElementById('trans-from').value;
                const to = document.getElementById('trans-to').value;
                const dur = document.getElementById('trans-duration').value;
                const price = document.getElementById('trans-price').value;
                if(!from || !to) return alert("請輸入出發與抵達站");
                
                newItem.from = from;
                newItem.to = to;
                newItem.duration = dur;
                newItem.price = price;
                
                // 清空
                document.getElementById('trans-from').value = '';
                document.getElementById('trans-to').value = '';
                document.getElementById('trans-duration').value = '';
                document.getElementById('trans-price').value = '';

            } else {
                const name = document.getElementById('new-name').value;
                const time = document.getElementById('new-time').value;
                if(!name) return alert("請輸入名稱");
                
                newItem.name = name;
                newItem.time = time;
                
                // 清空
                document.getElementById('new-name').value = '';
                document.getElementById('new-time').value = '';
                tempLat = null; tempLng = null;
            }

            // 預設加到第一天
            currentTripData.days[0].items.push(newItem);
            await saveTrip();
        };

        // --- 搜尋座標 ---
        window.searchPlace = async () => {
            const name = document.getElementById('new-name').value;
            if(!name) return alert("請先輸入名稱");
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}`);
            const data = await res.json();
            if(data.length > 0) {
                tempLat = data[0].lat; tempLng = data[0].lon;
                mapObj.setView([tempLat, tempLng], 14);
                L.marker([tempLat, tempLng]).addTo(mapObj).bindPopup("暫存位置").openPopup();
            } else { alert("找不到地點"); }
        };

        // --- 渲染時間軸 (Render) ---
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            Object.values(mapMarkers).forEach(m => mapObj.removeLayer(m));
            mapMarkers = {};

            currentTripData.days.forEach((day, dIdx) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-container';
                
                // 日期選擇器 Header
                dayDiv.innerHTML = `
                    <div class="day-header">
                        <input type="date" class="day-date-input" value="${day.date || ''}" 
                               onchange="updateDate(${dIdx}, this.value)" placeholder="選擇日期">
                        <button class="btn btn-danger btn-sm" onclick="deleteDay(${dIdx})">✕ 刪除天</button>
                    </div>
                    <div class="timeline" id="day-list-${dIdx}"></div>
                `;
                
                const listEl = dayDiv.querySelector('.timeline');

                day.items.forEach((item) => {
                    const el = document.createElement('div');
                    
                    if(item.type.includes('transport')) {
                        // 🚗 交通卡片樣式
                        el.className = 'item-transport';
                        el.innerHTML = `
                            <div class="transport-icon"><i class="fas fa-exchange-alt"></i></div>
                            <div class="transport-route">
                                <span>${item.from}</span>
                                <i class="fas fa-arrow-right" style="font-size:0.8em; opacity:0.6"></i>
                                <span>${item.to}</span>
                            </div>
                            <div class="transport-meta">
                                <span><i class="far fa-clock"></i> ${item.duration || 0} 分鐘</span>
                                ${item.price ? `<span><i class="fas fa-yen-sign"></i> ${item.price}</span>` : ''}
                            </div>
                            <button onclick="delItem('${day.id}', '${item.id}')" style="position:absolute; right:10px; top:10px; border:none; background:transparent; color:#fbbf24; cursor:pointer;">✕</button>
                        `;
                    } else {
                        // 📍 住宿 & 一般樣式
                        const isHotel = item.type.includes('hotel');
                        el.className = `item-card ${isHotel ? 'type-hotel' : ''}`;
                        el.innerHTML = `
                            <div class="timeline-dot"></div>
                            <div>
                                ${item.time ? `<span style="background:#0f172a; padding:2px 4px; border-radius:4px; font-size:0.8em; margin-right:5px; font-family:monospace;">${item.time}</span>` : ''}
                                <strong>${item.name}</strong>
                                ${isHotel ? '<span class="cat-badge">住宿</span>' : ''}
                            </div>
                            <button onclick="delItem('${day.id}', '${item.id}')" style="border:none; background:transparent; color:#64748b; cursor:pointer;">✕</button>
                        `;
                        
                        // 地圖連動
                        if(item.lat) {
                            el.onclick = (e) => {
                                if(e.target.tagName !== 'BUTTON') {
                                    mapObj.setView([item.lat, item.lng], 15);
                                    mapMarkers[item.id].openPopup();
                                }
                            };
                            const marker = L.marker([item.lat, item.lng]).addTo(mapObj).bindPopup(item.name);
                            if(isHotel) marker.setOpacity(0.9); // 區分住宿
                            mapMarkers[item.id] = marker;
                        }
                    }
                    el.dataset.itemId = item.id;
                    listEl.appendChild(el);
                });

                new Sortable(listEl, { group: 'shared', animation: 150, onEnd: handleSort });
                container.appendChild(dayDiv);
            });
        }

        // --- 輔助功能 ---
        window.updateDate = async (dIdx, newDate) => {
            currentTripData.days[dIdx].date = newDate;
            await saveTrip();
        };

        window.delItem = async (dayId, itemId) => {
            if(!confirm("刪除？")) return;
            const day = currentTripData.days.find(d => d.id === dayId);
            day.items = day.items.filter(i => i.id !== itemId);
            await saveTrip();
        };

        window.deleteDay = async (idx) => {
            if(!confirm("刪除整天？")) return;
            currentTripData.days.splice(idx, 1);
            await saveTrip();
        };

        window.addDay = async () => {
            const newId = 'day-' + Date.now();
            currentTripData.days.push({ id: newId, date: '', items: [] });
            await saveTrip();
        };

        async function handleSort() {
            const newDays = [];
            document.querySelectorAll('.day-container').forEach((dayDiv, dIdx) => {
                const oldDay = currentTripData.days[dIdx];
                const newItems = [];
                dayDiv.querySelectorAll('.item-card, .item-transport').forEach(el => {
                    const itemId = el.dataset.itemId;
                    let found = null;
                    currentTripData.days.forEach(d => {
                        const m = d.items.find(i => i.id === itemId);
                        if(m) found = m;
                    });
                    if(found) newItems.push(found);
                });
                newDays.push({ ...oldDay, items: newItems });
            });
            currentTripData.days = newDays;
            await saveTrip();
        }

        async function saveTrip() {
            await updateDoc(doc(db, "trips", currentTripId), { 
                days: currentTripData.days,
                categories: currentTripData.categories || []
            });
        }

        window.copyTripId = () => {
            navigator.clipboard.writeText(currentTripId);
            alert("已複製 ID");
        };

    </script>
</body>
