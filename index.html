<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Travel Architect Pro // Cloud</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        /* --- 登入遮罩 --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-box { text-align: center; padding: 40px; background: var(--panel); border-radius: 12px; border: 1px solid #334155; }
        .btn-google { background: #fff; color: #333; padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 1rem; }
        
        /* --- 主介面 --- */
        #sidebar { width: 380px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 1000; }
        #map { flex: 1; height: 100%; }

        /* 頂部資訊列 */
        .header { padding: 15px; border-bottom: 1px solid #334155; }
        .trip-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .trip-id { font-size: 0.8rem; color: #64748b; cursor: pointer; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; }

        /* 行程列表區 */
        #itinerary-content { flex: 1; overflow-y: auto; padding: 15px; }
        
        .day-column { margin-bottom: 20px; }
        .day-header { font-weight: bold; color: var(--accent); margin-bottom: 10px; border-bottom: 1px dashed #334155; padding-bottom: 5px; display: flex; justify-content: space-between; }
        
        .place-card {
            background: #283447; padding: 10px; margin-bottom: 8px; border-radius: 6px;
            cursor: grab; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid #ccc; font-size: 0.9rem; transition: transform 0.1s;
        }
        .place-card:active { cursor: grabbing; transform: scale(0.98); }
        .place-details { display: flex; flex-direction: column; gap: 2px; }
        .cat-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: #fff; width: fit-content; }
        
        /* 分類顏色 */
        .cat-hotel { border-color: #818cf8; } .cat-hotel .cat-tag { background: #818cf8; }
        .cat-food { border-color: #fb923c; } .cat-food .cat-tag { background: #fb923c; }
        .cat-transport { border-color: #38bdf8; } .cat-transport .cat-tag { background: #38bdf8; }
        .cat-shopping { border-color: #f472b6; } .cat-shopping .cat-tag { background: #f472b6; }
        .cat-sight { border-color: #4ade80; } .cat-sight .cat-tag { background: #4ade80; }
        .cat-custom { border-color: #94a3b8; } .cat-custom .cat-tag { background: #94a3b8; }

        .btn-action { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-action:hover { color: #fff; border-color: #fff; }
        
        /* 彈窗樣式 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid var(--accent); z-index: 2000; width: 300px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal input, .modal select { width: 100%; padding: 8px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h1>TRAVEL ARCHITECT</h1>
            <p style="color:#94a3b8; margin-bottom: 20px;">雲端協作行程規劃系統</p>
            <button id="btn-login" class="btn-google"><i class="fab fa-google"></i> Sign in with Google</button>
            
            <div style="margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px;">
                <input type="text" id="trip-code-input" placeholder="輸入旅程代碼 (選填)" style="padding:8px; width:200px; background:#0f172a; border:1px solid #334155; color:white;">
                <button id="btn-join" class="btn-action">加入現有旅程</button>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal">
        <h3 style="margin-top:0">新增地點</h3>
        <input type="text" id="place-name" placeholder="地點名稱">
        <select id="place-category">
            <option value="sight">🌲 景點 (Sightseeing)</option>
            <option value="food">🍜 吃飯 (Food)</option>
            <option value="shopping">🛍️ 逛街 (Shopping)</option>
            <option value="hotel">🏨 住宿 (Hotel)</option>
            <option value="transport">🚅 交通 (Transport)</option>
            <option value="custom">✨ 自訂 (Custom)</option>
        </select>
        <input type="text" id="custom-cat-name" placeholder="輸入自訂分類名稱" style="display:none;">
        <div class="modal-btns">
            <button class="btn-action" onclick="closeModal()">取消</button>
            <button class="btn-action" style="border-color:var(--accent); color:var(--accent)" onclick="confirmAddPlace()">新增</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="header">
            <div class="trip-info">
                <span style="font-weight:bold; color:var(--accent)" id="trip-name">My Trip</span>
                <span class="trip-id" onclick="copyTripId()" id="trip-id-display">ID: Loading...</span>
            </div>
            <div class="user-profile">
                <img src="" class="avatar" id="user-avatar">
                <span id="user-name">Guest</span>
                <button class="btn-action" onclick="logout()">登出</button>
            </div>
            <div style="margin-top: 10px; display:flex; gap:10px;">
                <button class="btn-action" onclick="addDay()">+ 天數</button>
                <div id="sync-status" style="font-size:0.8em; color:#4ade80; margin-left:auto; display:none;">● Live Sync</div>
            </div>
        </div>
        
        <div id="itinerary-content">
            </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ 這裡已經填入你的正確金鑰
        const firebaseConfig = {
          apiKey: "AIzaSyBzNnKXVglsGckbt4YK1MzMUqEapXaMqNw",
          authDomain: "travel-plan-1.firebaseapp.com",
          projectId: "travel-plan-1",
          storageBucket: "travel-plan-1.firebasestorage.app",
          messagingSenderId: "623643684132",
          appId: "1:623643684132:web:214e3cdd6289b0056657b1",
          measurementId: "G-HLX5TQ4VMW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 狀態變數
        let currentUser = null;
        let currentTripId = null;
        let tempClickCoords = null; // 暫存地圖點擊座標
        let mapMarkers = {}; // 存放地圖標記

        // --- 地圖初始化 ---
        const map = L.map('map').setView([33.5902, 130.4207], 10); // 預設九州福岡
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // --- 認證邏輯 ---
        const loginOverlay = document.getElementById('login-overlay');
        const btnLogin = document.getElementById('btn-login');
        const btnJoin = document.getElementById('btn-join');

        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("登入失敗:", error);
                alert("登入失敗，請確認 Firebase Authentication 是否已啟用 Google 登入。");
            });
        });

        // 登入狀態監聽
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
                
                // 決定要加入哪個旅程
                const codeInput = document.getElementById('trip-code-input').value;
                if(codeInput) {
                    loadTrip(codeInput);
                } else {
                    // 如果沒有輸入代碼，檢查是否有上次的旅程，或開新旅程
                    const lastTrip = localStorage.getItem('lastTripId');
                    if(lastTrip) loadTrip(lastTrip);
                    else createNewTrip();
                }
                loginOverlay.style.display = 'none';
            } else {
                loginOverlay.style.display = 'flex';
            }
        });

        window.logout = () => signOut(auth);

        btnJoin.addEventListener('click', () => {
            signInWithPopup(auth, provider); // 加入也是要先登入
        });

        // --- Firestore 旅程邏輯 ---

        async function createNewTrip() {
            // 產生一個隨機 ID
            const newTripId = 'TRIP-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            const tripRef = doc(db, "trips", newTripId);
            
            // 初始資料
            const initialData = {
                name: "九州建築之旅",
                members: [currentUser.uid],
                days: [
                    { id: 'day0', title: '待定清單 (Backlog)', items: [] },
                    { id: 'day1', title: 'Day 1: 福岡', items: [] }
                ]
            };

            try {
                await setDoc(tripRef, initialData);
                loadTrip(newTripId);
            } catch (error) {
                console.error("建立旅程失敗:", error);
                alert("建立資料失敗！請確認 Firestore 規則是否設為 Test Mode。");
            }
        }

        function loadTrip(tripId) {
            currentTripId = tripId;
            document.getElementById('trip-id-display').innerText = `CODE: ${tripId}`;
            localStorage.setItem('lastTripId', tripId);

            // 🔥 即時監聽 (Real-time Listener)
            // 當資料庫有變動，這裡會自動執行
            onSnapshot(doc(db, "trips", tripId), (docSnap) => {
                if (docSnap && docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('trip-name').innerText = data.name;
                    document.getElementById('sync-status').style.display = 'block'; // 顯示同步中
                    renderItinerary(data.days);
                } else {
                    // 如果找不到，可能是代碼錯誤或第一次建立失敗
                    console.log("查無此旅程，嘗試建立新旅程...");
                    // 避免無限迴圈，只有當使用者沒有明確輸入代碼時才自動建立
                    if (!document.getElementById('trip-code-input').value) {
                         createNewTrip(); 
                    } else {
                        alert("找不到該旅程代碼！");
                    }
                }
            }, (error) => {
                console.error("監聽失敗:", error);
                alert("讀取資料失敗，請檢查 Firestore 權限。");
            });
        }

        // --- 渲染 UI ---
        function renderItinerary(days) {
            const container = document.getElementById('itinerary-content');
            container.innerHTML = ''; // 清空

            // 清除地圖標記
            Object.values(mapMarkers).forEach(m => map.removeLayer(m));
            mapMarkers = {};

            days.forEach((day, dayIndex) => {
                const dayEl = document.createElement('div');
                dayEl.className = 'day-column';
                dayEl.innerHTML = `
                    <div class="day-header">
                        <span>${day.title}</span>
                        <span style="font-size:0.8em; opacity:0.6">${day.items.length} spots</span>
                    </div>
                    <div class="sortable-list" data-day-index="${dayIndex}"></div>
                `;
                
                const listEl = dayEl.querySelector('.sortable-list');

                day.items.forEach((item, itemIndex) => {
                    const card = document.createElement('div');
                    card.className = `place-card cat-${item.category}`;
                    
                    // 判斷顯示名稱 (如果有自訂分類)
                    let catDisplay = item.categoryName || item.category.toUpperCase();
                    
                    card.innerHTML = `
                        <div class="place-details">
                            <span style="font-weight:600">${item.name}</span>
                            <span class="cat-tag">${catDisplay}</span>
                        </div>
                        <button class="btn-action" onclick="deleteItem(${dayIndex}, ${itemIndex})">✕</button>
                    `;
                    
                    // 地圖連動
                    card.addEventListener('click', (e) => {
                        if(e.target.tagName !== 'BUTTON') {
                            map.flyTo([item.lat, item.lng], 15);
                            // 檢查標記是否存在才開 popup
                            if(mapMarkers[`${dayIndex}-${itemIndex}`]) {
                                mapMarkers[`${dayIndex}-${itemIndex}`].openPopup();
                            }
                        }
                    });

                    listEl.appendChild(card);
                    addMapMarker(item, dayIndex, itemIndex);
                });

                container.appendChild(dayEl);

                // 綁定拖拉
                new Sortable(listEl, {
                    group: 'shared', // 允許跨天拖曳
                    animation: 150,
                    onEnd: function (evt) {
                        saveReorderedData(); // 拖曳結束後儲存到雲端
                    }
                });
            });
        }

        function addMapMarker(item, dIdx, iIdx) {
            // 根據分類換顏色的小圓點 (這裡簡化用標準標記)
            const marker = L.marker([item.lat, item.lng])
                .addTo(map)
                .bindPopup(`<b>${item.name}</b><br>${item.categoryName || item.category}`);
            mapMarkers[`${dIdx}-${iIdx}`] = marker;
        }

        // --- 互動功能 ---

        // 1. 點擊地圖開彈窗
        map.on('click', (e) => {
            if(!currentTripId) return;
            tempClickCoords = e.latlng;
            document.getElementById('place-name').value = '';
            document.getElementById('add-modal').style.display = 'block';
            document.getElementById('place-name').focus();
        });

        // 2. 自訂分類切換
        document.getElementById('place-category').addEventListener('change', (e) => {
            const customInput = document.getElementById('custom-cat-name');
            if(e.target.value === 'custom') customInput.style.display = 'block';
            else customInput.style.display = 'none';
        });

        // 3. 確認新增地點
        window.confirmAddPlace = async () => {
            const name = document.getElementById('place-name').value;
            if(!name) return;

            const catSelect = document.getElementById('place-category');
            const category = catSelect.value;
            let categoryName = catSelect.options[catSelect.selectedIndex].text.split(' ')[1]; // 取出中文
            
            if(category === 'custom') {
                categoryName = document.getElementById('custom-cat-name').value || "自訂";
            }

            const newItem = {
                name: name,
                category: category,
                categoryName: categoryName,
                lat: tempClickCoords.lat,
                lng: tempClickCoords.lng
            };

            // 讀取當前資料
            const docRef = doc(db, "trips", currentTripId);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const tripData = docSnap.data();
                // 加入到第一天 (Day 0 / Backlog)
                tripData.days[0].items.push(newItem);
                // 寫回雲端
                await updateDoc(docRef, { days: tripData.days });
            }
            
            closeModal();
        };

        window.closeModal = () => {
            document.getElementById('add-modal').style.display = 'none';
        };

        // 4. 刪除地點
        window.deleteItem = async (dayIndex, itemIndex) => {
            if(!confirm("確定刪除？")) return;
            const docRef = doc(db, "trips", currentTripId);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const tripData = docSnap.data();
                tripData.days[dayIndex].items.splice(itemIndex, 1);
                await updateDoc(docRef, { days: tripData.days });
            }
        };

        // 5. 拖拉後儲存 (Reorder)
        async function saveReorderedData() {
            // 從 DOM 重組資料結構
            // 注意：這是為了快速原型開發的簡易實作。
            // 在正式環境中，建議使用 unique ID 來追蹤 item，而不是依賴 DOM 裡的文字。
            
            const docRef = doc(db, "trips", currentTripId);
            const docSnap = await getDoc(docRef);
            
            if (!docSnap.exists()) return;
            
            const oldDays = docSnap.data().days;
            const reorderedDays = [];
            
            // 收集所有舊的 items 到一個大池子，方便查找
            let allItemsPool = [];
            oldDays.forEach(d => allItemsPool = allItemsPool.concat(d.items));
            
            document.querySelectorAll('.day-column').forEach((col, dIdx) => {
                // 如果是新加的天數，可能 oldDays[dIdx] 不存在
                let title = "New Day";
                let id = "new_day_" + dIdx;
                
                if (oldDays[dIdx]) {
                    title = oldDays[dIdx].title;
                    id = oldDays[dIdx].id;
                } else {
                    // 這種情況發生在 DOM 已經變了但 data 還沒變的時候
                    // 簡單處理：用預設值
                }

                const items = [];
                col.querySelectorAll('.place-card').forEach(card => {
                    const nameSpan = card.querySelector('.place-details span:first-child');
                    if(nameSpan) {
                        const name = nameSpan.innerText;
                        // 嘗試從池子裡撈回原始資料 (包含 lat/lng 等)
                        // 注意：如果有重複名稱的地點，這裡可能會撈錯，這是原型的限制
                        const foundItem = allItemsPool.find(i => i.name === name); 
                        if(foundItem) items.push(foundItem);
                    }
                });
                reorderedDays.push({ id: id, title: title, items: items });
            });
            
            await updateDoc(docRef, { days: reorderedDays });
        }

        // 6. 增加天數
        window.addDay = async () => {
            const docRef = doc(db, "trips", currentTripId);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const tripData = docSnap.data();
                tripData.days.push({
                    id: `day${tripData.days.length}`,
                    title: `Day ${tripData.days.length}: 新行程`,
                    items: []
                });
                await updateDoc(docRef, { days: tripData.days });
            }
        };
        
        // 7. 複製代碼
        window.copyTripId = () => {
            navigator.clipboard.writeText(currentTripId);
            alert("旅程代碼已複製！傳給家人即可加入: " + currentTripId);
        };

    </script>
</body>
</html>
