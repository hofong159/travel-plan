<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Travel Architect v5.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #0f172a; --sidebar: #1e293b; --card: #334155; 
            --accent: #38bdf8; --text: #f8fafc; --text-sub: #94a3b8;
            --danger: #ef4444; --success: #22c55e;
            --transport: #f59e0b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; }

        /* --- 佈局架構 --- */
        #app-container { display: flex; width: 100%; height: 100%; }
        
        /* 1. 左側：天數導覽 (Nav) */
        #nav-sidebar {
            width: 240px; background: #020617; border-right: 1px solid #1e293b;
            display: flex; flex-direction: column; padding: 15px; z-index: 10;
        }

        /* 2. 中間：行程列表 (List) */
        #main-list {
            width: 420px; background: var(--sidebar); border-right: 1px solid #1e293b;
            display: flex; flex-direction: column; position: relative;
        }

        /* 3. 右側：地圖 (Map) */
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* --- 元件樣式 --- */
        .nav-item {
            padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer;
            color: var(--text-sub); font-weight: 600; display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .nav-item:hover { background: #1e293b; color: #fff; }
        .nav-item.active { background: var(--accent); color: #0f172a; }
        
        .nav-header { padding-bottom: 20px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
        .trip-title { font-size: 1.2rem; font-weight: 800; color: #fff; }

        /* 行程卡片 */
        #day-content { flex: 1; overflow-y: auto; padding: 15px; }

        .spot-card {
            background: var(--card); border-radius: 8px; padding: 12px; margin-bottom: 15px;
            border-left: 4px solid var(--accent); position: relative; cursor: grab;
            display: flex; gap: 12px; align-items: flex-start;
        }
        .spot-card:hover { filter: brightness(1.1); }
        
        .spot-time {
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            background: rgba(0,0,0,0.3); padding: 4px 6px; border-radius: 4px; color: var(--accent);
            min-width: 50px; text-align: center;
        }
        
        /* 交通卡片 (連接線風格) */
        .transport-card {
            background: rgba(245, 158, 11, 0.1); border: 1px dashed var(--transport);
            color: var(--transport); padding: 8px 12px; margin: -5px 0 10px 20px;
            border-radius: 6px; font-size: 0.9rem; position: relative;
            display: flex; align-items: center; gap: 10px;
        }
        .transport-card::before {
            content: ''; position: absolute; left: -24px; top: -15px; height: 140%; 
            border-left: 2px dotted #475569; z-index: 0;
        }

        /* 按鈕 */
        .btn { border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-icon { background: transparent; color: #64748b; padding: 4px; }
        .btn-icon:hover { color: #fff; }
        .btn-float {
            position: absolute; bottom: 20px; right: 20px; 
            width: 50px; height: 50px; border-radius: 50%; 
            background: var(--accent); color: #000; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
        }

        /* 彈窗 (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999; display: none;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background: #1e293b; width: 400px; padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #475569;
        }
        
        /* Modal Tabs */
        .type-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-tab { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #64748b; text-align: center; border-radius: 6px; cursor: pointer; }
        .type-tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: bold; }
        
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
        .row { display: flex; gap: 10px; }

        /* 大廳 (Lobby) */
        #view-lobby { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .trip-card { background: var(--sidebar); width: 320px; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; cursor: pointer; }

    </style>
</head>
<body>

    <div id="view-lobby">
        <h1 style="color:var(--accent)">TRAVEL ARCHITECT v5</h1>
        <div style="margin-bottom:30px; color:#64748b" id="user-display">Guest</div>
        
        <div style="width:320px;">
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px;" onclick="createNewTrip()">+ 建立新旅程</button>
            <div class="row">
                <input id="join-code" placeholder="輸入邀請碼 ID">
                <button class="btn btn-primary" onclick="joinTrip()">加入</button>
            </div>
        </div>

        <div id="trip-list" style="margin-top:20px; width:320px;"></div>
    </div>

    <div id="app-container" style="display:none;">
        
        <div id="nav-sidebar">
            <div class="nav-header">
                <div class="trip-title" id="trip-title">載入中...</div>
                <div style="font-size:0.8rem; color:#64748b; margin-top:5px; cursor:pointer;" onclick="copyId()" id="trip-id-disp">ID: ---</div>
                <button class="btn btn-primary" style="width:100%; margin-top:15px; font-size:0.8rem;" onclick="backToLobby()">回大廳</button>
            </div>
            
            <div id="day-nav-list" style="flex:1; overflow-y:auto;">
                </div>
            
            <button class="btn" style="background:#334155; color:#fff; width:100%; margin-top:10px;" onclick="addDay()">+ 新增天數</button>
        </div>

        <div id="main-list">
            <div style="padding:15px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
                <span id="current-day-title" style="font-weight:bold; font-size:1.1rem;">Day 1</span>
                <div>
                    <input type="date" id="day-date-picker" style="width:auto; padding:4px; margin:0;" onchange="updateDayDate(this.value)">
                    <button class="btn btn-icon" style="color:var(--danger)" onclick="deleteCurrentDay()"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <div id="day-content">
                </div>

            <button class="btn" style="background:#1e293b; border-top:1px solid #334155; padding:15px; color:#94a3b8;" onclick="openBudgetModal()">
                <i class="fas fa-wallet"></i> 查看記帳
            </button>

            <div class="btn-float" onclick="openAddModal()">+</div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <div id="modal-add" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0; color:#fff;">新增行程</h3>
            
            <div class="type-tabs">
                <div class="type-tab active" onclick="setAddType('place')" id="tab-place">📍 景點</div>
                <div class="type-tab" onclick="setAddType('transport')" id="tab-transport">🚄 交通</div>
                <div class="type-tab" onclick="setAddType('hotel')" id="tab-hotel">🏨 住宿</div>
            </div>

            <div id="form-place">
                <input id="input-name" placeholder="名稱 (例: 雷門)">
                <div class="row">
                    <input type="time" id="input-time">
                    <button class="btn btn-primary" style="white-space:nowrap;" onclick="searchAndLocate()">🔍 搜尋定位</button>
                </div>
            </div>

            <div id="form-transport" style="display:none;">
                <div class="row">
                    <input id="trans-from" placeholder="出發地">
                    <input id="trans-to" placeholder="目的地">
                </div>
                <div class="row">
                    <input id="trans-time" placeholder="耗時 (例: 30分)">
                    <input id="trans-cost" placeholder="票價 (選填)">
                </div>
            </div>

            <div class="row" style="margin-top:20px;">
                <button class="btn" style="background:#334155; color:#fff; flex:1;" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmAddItem()">加入</button>
            </div>
        </div>
    </div>

    <div id="modal-budget" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0;">記帳本</h3>
            <div class="row">
                <input id="bud-item" placeholder="項目">
                <input id="bud-cost" type="number" placeholder="金額">
            </div>
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px;" onclick="addBudget()">記一筆</button>
            <div id="budget-list" style="max-height:200px; overflow-y:auto; border-top:1px solid #334155; padding-top:10px;"></div>
            <div style="text-align:right; margin-top:10px; font-weight:bold; color:var(--success)" id="budget-total">Total: $0</div>
            <button class="btn" style="width:100%; margin-top:15px; background:#334155; color:#fff;" onclick="document.getElementById('modal-budget').style.display='none'">關閉</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyBzNnKXVglsGckbt4YK1MzMUqEapXaMqNw",
          authDomain: "travel-plan-1.firebaseapp.com",
          projectId: "travel-plan-1",
          storageBucket: "travel-plan-1.firebasestorage.app",
          messagingSenderId: "623643684132",
          appId: "1:623643684132:web:214e3cdd6289b0056657b1",
          measurementId: "G-HLX5TQ4VMW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentTripId = null;
        let currentTripData = null;
        let currentDayIdx = 0;
        let mapObj = null;
        let mapMarkers = {};
        let addType = 'place';
        let tempGeo = null;

        // --- Auth ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-display').innerText = user.displayName;
                loadLobby();
            } else {
                signInWithPopup(auth, provider);
            }
        });
        window.logout = () => signOut(auth);

        // --- Map ---
        function initMap() {
            if(mapObj) return;
            mapObj = L.map('map').setView([35.689, 139.692], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: 'OSM' }).addTo(mapObj);
        }

        // --- Lobby ---
        function loadLobby() {
            document.getElementById('view-lobby').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
            
            const q = query(collection(db, "trips"), where("members", "array-contains", currentUser.uid));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('trip-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    const el = document.createElement('div');
                    el.className = 'trip-card';
                    el.innerHTML = `
                        <div style="font-weight:bold; font-size:1.1rem; color:#fff">${data.name}</div>
                        <div style="color:#64748b; font-size:0.8rem; margin-top:5px;">${data.days.length} 天 • ${data.members.length} 人</div>
                    `;
                    el.onclick = () => enterTrip(d.id);
                    list.appendChild(el);
                });
            });
        }

        window.createNewTrip = async () => {
            const name = prompt("旅程名稱:");
            if(!name) return;
            const newId = 'TRIP-' + Math.random().toString(36).substr(2,6).toUpperCase();
            await setDoc(doc(db, "trips", newId), {
                name, members: [currentUser.uid],
                days: [{ id: 'day1', title: 'Day 1', date: '', items: [] }],
                expenses: []
            });
        };

        window.joinTrip = async () => {
            const code = document.getElementById('join-code').value;
            if(!code) return;
            const ref = doc(db, "trips", code);
            const snap = await getDoc(ref);
            if(snap.exists()) {
                await updateDoc(ref, { members: arrayUnion(currentUser.uid) });
                enterTrip(code);
            }
        };

        // --- App Logic ---
        window.enterTrip = (id) => {
            currentTripId = id;
            document.getElementById('view-lobby').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('trip-id-disp').innerText = `ID: ${id}`;
            initMap();
            mapObj.invalidateSize();

            onSnapshot(doc(db, "trips", id), (snap) => {
                if(!snap.exists()) return loadLobby();
                currentTripData = snap.data();
                document.getElementById('trip-title').innerText = currentTripData.name;
                renderNav();
                renderDayContent();
            });
        };

        window.backToLobby = () => {
            currentTripId = null;
            loadLobby();
        };

        // --- Navigation ---
        function renderNav() {
            const list = document.getElementById('day-nav-list');
            list.innerHTML = '';
            currentTripData.days.forEach((day, idx) => {
                const div = document.createElement('div');
                div.className = `nav-item ${idx === currentDayIdx ? 'active' : ''}`;
                div.innerHTML = `<span>Day ${idx + 1}</span> <span style="font-size:0.7em; opacity:0.7">${day.date || ''}</span>`;
                div.onclick = () => { currentDayIdx = idx; renderNav(); renderDayContent(); };
                list.appendChild(div);
            });
        }

        // --- Main Content Render ---
        function renderDayContent() {
            const day = currentTripData.days[currentDayIdx];
            document.getElementById('current-day-title').innerText = `Day ${currentDayIdx + 1}`;
            document.getElementById('day-date-picker').value = day.date || '';
            
            const container = document.getElementById('day-content');
            container.innerHTML = '';
            
            // Map Cleanup
            Object.values(mapMarkers).forEach(m => mapObj.removeLayer(m));
            mapMarkers = {};

            day.items.forEach(item => {
                const div = document.createElement('div');
                
                if(item.type === 'transport') {
                    // 🚄 交通卡片
                    div.className = 'transport-card';
                    div.innerHTML = `
                        <i class="fas fa-train"></i>
                        <span>${item.from} <i class="fas fa-arrow-right" style="font-size:0.8em"></i> ${item.to}</span>
                        <span style="font-size:0.8em; opacity:0.8; margin-left:auto;">${item.duration}</span>
                        <i class="fas fa-times" onclick="deleteItem('${item.id}')" style="cursor:pointer; margin-left:10px;"></i>
                    `;
                } else {
                    // 📍 景點/住宿卡片
                    div.className = 'spot-card';
                    div.innerHTML = `
                        <div class="spot-time">${item.time || '--:--'}</div>
                        <div style="flex:1;">
                            <div style="font-weight:bold;">${item.name}</div>
                            ${item.type === 'hotel' ? '<span style="font-size:0.7rem; background:#4f46e5; padding:2px 4px; border-radius:3px;">住宿</span>' : ''}
                        </div>
                        <i class="fas fa-times" onclick="deleteItem('${item.id}')" style="cursor:pointer; color:#94a3b8;"></i>
                    `;
                    
                    if(item.lat) {
                        div.onclick = (e) => {
                            if(e.target.tagName !== 'I') {
                                mapObj.setView([item.lat, item.lng], 15);
                                mapMarkers[item.id].openPopup();
                            }
                        };
                        const m = L.marker([item.lat, item.lng]).addTo(mapObj).bindPopup(item.name);
                        mapMarkers[item.id] = m;
                    }
                }
                div.dataset.id = item.id;
                container.appendChild(div);
            });

            new Sortable(container, { animation: 150, onEnd: handleSort });
        }

        // --- Data Handling ---
        window.updateDayDate = (date) => {
            currentTripData.days[currentDayIdx].date = date;
            saveTrip();
        };

        window.addDay = () => {
            currentTripData.days.push({ id: crypto.randomUUID(), title: '', items: [] });
            saveTrip();
        };

        window.deleteCurrentDay = () => {
            if(!confirm("刪除這整天？")) return;
            currentTripData.days.splice(currentDayIdx, 1);
            if(currentTripData.days.length === 0) window.addDay();
            currentDayIdx = 0;
            saveTrip();
        };

        window.deleteItem = (itemId) => {
            if(!confirm("刪除此項目？")) return;
            const day = currentTripData.days[currentDayIdx];
            day.items = day.items.filter(i => i.id !== itemId);
            saveTrip();
        };

        async function handleSort() {
            const newItems = [];
            const day = currentTripData.days[currentDayIdx];
            document.querySelectorAll('#day-content > div').forEach(el => {
                const item = day.items.find(i => i.id === el.dataset.id);
                if(item) newItems.push(item);
            });
            currentTripData.days[currentDayIdx].items = newItems;
            await saveTrip();
        }

        async function saveTrip() {
            await updateDoc(doc(db, "trips", currentTripId), { 
                days: currentTripData.days,
                expenses: currentTripData.expenses || []
            });
        }

        // --- Modal & Adding Items ---
        window.openAddModal = () => {
            document.getElementById('modal-add').style.display = 'flex';
            tempGeo = null;
        };
        window.closeModal = () => document.getElementById('modal-add').style.display = 'none';

        window.setAddType = (type) => {
            addType = type;
            document.querySelectorAll('.type-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');

            if(type === 'transport') {
                document.getElementById('form-place').style.display = 'none';
                document.getElementById('form-transport').style.display = 'block';
            } else {
                document.getElementById('form-place').style.display = 'block';
                document.getElementById('form-transport').style.display = 'none';
            }
        };

        window.searchAndLocate = async () => {
            const name = document.getElementById('input-name').value;
            if(!name) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}`);
            const data = await res.json();
            if(data.length > 0) {
                tempGeo = { lat: data[0].lat, lng: data[0].lon };
                alert("已定位: " + name);
            } else { alert("找不到地點"); }
        };

        window.confirmAddItem = () => {
            const newItem = { id: crypto.randomUUID(), type: addType };
            
            if(addType === 'transport') {
                newItem.from = document.getElementById('trans-from').value;
                newItem.to = document.getElementById('trans-to').value;
                newItem.duration = document.getElementById('trans-time').value;
                newItem.cost = document.getElementById('trans-cost').value;
                if(!newItem.from || !newItem.to) return alert("請輸入起訖點");
            } else {
                newItem.name = document.getElementById('input-name').value;
                newItem.time = document.getElementById('input-time').value;
                if(tempGeo) { newItem.lat = tempGeo.lat; newItem.lng = tempGeo.lng; }
                if(!newItem.name) return alert("請輸入名稱");
            }

            currentTripData.days[currentDayIdx].items.push(newItem);
            saveTrip();
            
            // Cleanup inputs
            document.getElementById('input-name').value = '';
            document.getElementById('trans-from').value = '';
            document.getElementById('trans-to').value = '';
            closeModal();
        };

        // --- Budget ---
        window.openBudgetModal = () => {
            document.getElementById('modal-budget').style.display = 'flex';
            renderBudgetList();
        };

        window.addBudget = async () => {
            const item = document.getElementById('bud-item').value;
            const cost = parseInt(document.getElementById('bud-cost').value);
            if(!item || !cost) return;
            
            currentTripData.expenses.push({ item, cost, user: currentUser.displayName });
            await saveTrip();
            document.getElementById('bud-item').value = '';
            document.getElementById('bud-cost').value = '';
            renderBudgetList();
        };

        function renderBudgetList() {
            const list = document.getElementById('budget-list');
            list.innerHTML = '';
            let total = 0;
            (currentTripData.expenses || []).forEach((ex, idx) => {
                total += ex.cost;
                const d = document.createElement('div');
                d.style.cssText = "display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #334155;";
                d.innerHTML = `<span>${ex.item} <small style="color:#64748b">(${ex.user})</small></span> <span style="color:#22c55e">$${ex.cost}</span>`;
                list.appendChild(d);
            });
            document.getElementById('budget-total').innerText = `Total: $${total}`;
        }
        
        window.copyId = () => navigator.clipboard.writeText(currentTripId).then(()=>alert("已複製"));

    </script>
</body>
</html>
