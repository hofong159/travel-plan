<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Travel Architect v7.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #111827; --card: #1f2937; --input-bg: #374151;
            --primary: #3b82f6; --text: #f3f4f6; --gray: #9ca3af;
            --danger: #ef4444; --success: #10b981;
            --transport-bg: #451a03; --transport-border: #d97706;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- 頂部導航 --- */
        #navbar {
            height: 60px; background: #0f172a; border-bottom: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 50;
        }
        .nav-btn {
            background: transparent; border: none; color: var(--gray); font-size: 1rem;
            padding: 0 15px; height: 60px; cursor: pointer; border-bottom: 3px solid transparent;
        }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(59,130,246,0.1); font-weight: bold; }

        /* --- 主畫面 --- */
        #main-container { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* 1. 行程區塊 */
        #view-itinerary { display: flex; width: 100%; height: 100%; }
        
        /* 左側列表 */
        #itinerary-list { 
            width: 450px; overflow-y: auto; padding: 15px; 
            background: var(--bg); border-right: 1px solid #334155;
            padding-bottom: 100px; /* 預留底部空間 */
        }

        /* 每一天容器 */
        .day-container {
            background: var(--card); border: 1px solid #374151; border-radius: 8px;
            margin-bottom: 20px; overflow: hidden;
        }
        .day-header {
            background: #111827; padding: 10px 15px; border-bottom: 1px solid #374151;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .day-header:hover { background: #1f2937; }
        .day-title { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        
        .day-body { padding: 10px; min-height: 50px; }
        .day-body.collapsed { display: none; }

        /* 行程卡片 */
        .item-card {
            background: #2d3748; padding: 12px; margin-bottom: 8px; border-radius: 6px;
            display: flex; gap: 10px; align-items: center; position: relative;
            border-left: 4px solid #718096; cursor: grab;
        }
        .item-card:hover { filter: brightness(1.1); }
        
        .item-card.type-transport {
            background: var(--transport-bg); border-left-color: var(--transport-border);
        }

        /* 新增按鈕 (大) */
        .btn-add-block {
            width: 100%; padding: 12px; background: #374151; border: none; color: #d1d5db;
            cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px;
            transition: 0.2s; border-top: 1px solid #4b5563;
        }
        .btn-add-block:hover { background: #4b5563; color: #fff; }

        /* 右側地圖 */
        #map-wrapper { flex: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }

        /* 2. 記帳區塊 */
        #view-budget { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; align-items: center; overflow-y: auto; }
        .budget-box { width: 100%; max-width: 800px; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #374151; margin-bottom: 20px; }

        /* 輸入框樣式 (標準化) */
        input, select {
            width: 100%; padding: 12px; margin-bottom: 10px;
            background: #000; border: 1px solid #4b5563; color: #fff;
            border-radius: 6px; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--primary); }
        label { display: block; margin-bottom: 5px; color: var(--gray); font-size: 0.9rem; }

        /* 按鈕樣式 */
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .btn-sm { padding: 5px 10px; font-size: 0.85rem; }

        /* 彈窗 (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 999; display: none;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1f2937; width: 90%; max-width: 450px; padding: 25px;
            border-radius: 12px; border: 1px solid #4b5563; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* 類型切換 */
        .type-tabs { display: flex; margin-bottom: 15px; background: #111827; padding: 5px; border-radius: 8px; }
        .type-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--gray); border-radius: 6px; }
        .type-tab.active { background: var(--primary); color: #fff; font-weight: bold; }

        /* 大廳 */
        #view-lobby { position: fixed; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .trip-item { width: 320px; background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 1px solid #374151; }
        .trip-item:hover { border-color: var(--primary); }

    </style>
</head>
<body>

    <div id="view-lobby">
        <h1 style="color:var(--primary)">Travel Architect v7.0</h1>
        <div id="user-status" style="color:var(--gray); margin-bottom:30px;">載入中...</div>
        
        <div style="width:320px">
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px;" onclick="createNewTrip()">+ 建立新旅程</button>
            <div style="display:flex; gap:5px; margin-bottom:20px;">
                <input id="join-code" placeholder="輸入邀請碼 ID" style="margin:0;">
                <button class="btn btn-primary" onclick="joinTrip()">加入</button>
            </div>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="navbar" style="display:none;">
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn-sm btn-danger" onclick="backToLobby()"><i class="fas fa-arrow-left"></i> 離開</button>
            <span id="nav-trip-title" style="font-weight:bold;">旅程</span>
            <span id="nav-trip-id" style="font-size:0.8rem; color:var(--gray); cursor:pointer;" onclick="copyId()">ID</span>
        </div>
        <div style="display:flex;">
            <button class="nav-btn active" onclick="switchTab('itinerary')">行程</button>
            <button class="nav-btn" onclick="switchTab('budget')">記帳</button>
        </div>
    </div>

    <div id="main-container" style="display:none;">
        
        <div id="view-itinerary">
            <div id="itinerary-list">
                <div id="days-wrapper">
                    </div>
                <button class="btn" style="width:100%; background:#374151; color:#fff; padding:15px; margin-top:20px;" onclick="addDay()">
                    + 新增一天 (Add Day)
                </button>
            </div>
            <div id="map-wrapper">
                <div id="map"></div>
            </div>
        </div>

        <div id="view-budget">
            <div class="budget-box">
                <h3 style="margin-top:0; border-bottom:1px solid #4b5563; padding-bottom:10px;">記一筆</h3>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label>日期</label>
                        <input type="date" id="bud-date">
                    </div>
                    <div style="flex:2">
                        <label>項目</label>
                        <input type="text" id="bud-item" placeholder="早餐, 車票...">
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label>金額</label>
                        <input type="number" id="bud-cost" placeholder="$">
                    </div>
                    <div style="flex:1">
                        <label>分類</label>
                        <select id="bud-cat">
                            <option value="food">🍜 食物</option>
                            <option value="transport">🚗 交通</option>
                            <option value="shop">🛍️ 購物</option>
                            <option value="stay">🏨 住宿</option>
                            <option value="other">✨ 其他</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addExpense()">確認新增</button>
            </div>

            <div class="budget-box" style="flex:1;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>支出明細</h3>
                    <h3 style="color:var(--success)" id="budget-total">Total: $0</h3>
                </div>
                <div id="budget-list" style="margin-top:10px;"></div>
            </div>
        </div>
    </div>

    <div id="modal-add" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#fff;">新增行程</h3>
            
            <div class="type-tabs">
                <div class="type-tab active" id="tab-place" onclick="toggleType('place')">📍 一般/景點</div>
                <div class="type-tab" id="tab-transport" onclick="toggleType('transport')">🚄 交通移動</div>
            </div>

            <div id="form-place">
                <label>名稱</label>
                <input id="inp-name" placeholder="輸入地點名稱 (例: 淺草寺)">
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label>時間</label>
                        <input type="time" id="inp-time">
                    </div>
                    <div style="flex:1; display:flex; align-items:flex-end;">
                        <button class="btn" style="width:100%; background:#374151; color:#fff; height:46px;" onclick="searchLoc()">
                            <i class="fas fa-search"></i> 定位
                        </button>
                    </div>
                </div>
            </div>

            <div id="form-transport" style="display:none;">
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label>出發地</label>
                        <input id="trans-from" placeholder="例: 京都">
                    </div>
                    <div style="flex:1">
                        <label>目的地</label>
                        <input id="trans-to" placeholder="例: 大阪">
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label>方式/備註</label>
                        <input id="trans-desc" placeholder="例: JR電車">
                    </div>
                    <div style="flex:1">
                        <label>耗時 (分鐘)</label>
                        <input type="number" id="trans-dur" placeholder="30">
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="flex:1; background:#374151; color:#ccc;" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmAdd()">確認加入</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ Firebase Config (保留你的設定)
        const firebaseConfig = {
          apiKey: "AIzaSyBzNnKXVglsGckbt4YK1MzMUqEapXaMqNw",
          authDomain: "travel-plan-1.firebaseapp.com",
          projectId: "travel-plan-1",
          storageBucket: "travel-plan-1.firebasestorage.app",
          messagingSenderId: "623643684132",
          appId: "1:623643684132:web:214e3cdd6289b0056657b1",
          measurementId: "G-HLX5TQ4VMW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentTripId = null;
        let tripData = null;
        let map = null;
        let markers = {};
        
        // UI State
        let targetDayIdx = 0;
        let addType = 'place';
        let tempLoc = null;

        // --- Auth ---
        onAuthStateChanged(auth, (u) => {
            if (u) {
                currentUser = u;
                document.getElementById('user-status').innerText = `已登入: ${u.displayName}`;
                loadLobby();
            } else {
                signInWithPopup(auth, provider);
            }
        });

        // --- Map ---
        function initMap() {
            if(map) return;
            map = L.map('map').setView([35.689, 139.692], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: 'OSM' }).addTo(map);
        }

        // --- Lobby ---
        function loadLobby() {
            document.getElementById('view-lobby').style.display = 'flex';
            document.getElementById('navbar').style.display = 'none';
            document.getElementById('main-container').style.display = 'none';

            const q = query(collection(db, "trips"), where("members", "array-contains", currentUser.uid));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('lobby-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    const el = document.createElement('div');
                    el.className = 'trip-item';
                    el.innerHTML = `<b>${data.name}</b> <span style="float:right">${data.days.length} 天</span>`;
                    el.onclick = () => loadTrip(d.id);
                    list.appendChild(el);
                });
            });
        }

        window.createNewTrip = async () => {
            const name = prompt("旅程名稱:");
            if(!name) return;
            const newId = 'TRIP-' + generateSafeId();
            await setDoc(doc(db, "trips", newId), {
                name, members: [currentUser.uid],
                days: [{ id: generateSafeId(), date: '', items: [] }],
                expenses: []
            });
        };

        window.joinTrip = async () => {
            const code = document.getElementById('join-code').value;
            if(!code) return alert("請輸入 ID");
            const ref = doc(db, "trips", code);
            const snap = await getDoc(ref);
            if(snap.exists()) {
                await updateDoc(ref, { members: arrayUnion(currentUser.uid) });
                loadTrip(code);
            } else {
                alert("找不到此旅程");
            }
        };

        // --- Trip Logic ---
        function loadTrip(id) {
            currentTripId = id;
            document.getElementById('view-lobby').style.display = 'none';
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('main-container').style.display = 'flex';
            document.getElementById('nav-trip-id').innerText = `ID: ${id}`;
            initMap();
            setTimeout(() => map.invalidateSize(), 500); // Fix map size

            onSnapshot(doc(db, "trips", id), (snap) => {
                if(!snap.exists()) return loadLobby();
                tripData = snap.data();
                document.getElementById('nav-trip-title').innerText = tripData.name;
                renderItinerary();
                renderBudget();
            });
        }

        window.backToLobby = () => { currentTripId = null; loadLobby(); };
        
        window.switchTab = (tab) => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-itinerary').style.display = 'none';
            document.getElementById('view-budget').style.display = 'none';
            
            if(tab === 'itinerary') {
                document.getElementById('view-itinerary').style.display = 'flex';
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            } else {
                document.getElementById('view-budget').style.display = 'flex';
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
            }
        };

        // --- Itinerary Render ---
        function renderItinerary() {
            const wrapper = document.getElementById('days-wrapper');
            wrapper.innerHTML = '';
            
            // Clear markers
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};

            tripData.days.forEach((day, idx) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-container';
                
                // Day Header
                dayDiv.innerHTML = `
                    <div class="day-header" onclick="toggleDay(${idx})">
                        <div class="day-title">Day ${idx+1}</div>
                        <div onclick="event.stopPropagation()">
                            <input type="date" class="day-date-input" value="${day.date||''}" onchange="updateDate(${idx}, this.value)">
                            <button class="btn-sm btn-danger" onclick="deleteDay(${idx})">✕</button>
                        </div>
                    </div>
                    <div class="day-body" id="day-body-${idx}">
                        <div class="sortable-list" data-idx="${idx}"></div>
                    </div>
                    <button class="btn-add-block" onclick="openModal(${idx})">
                        <i class="fas fa-plus"></i> 新增行程
                    </button>
                `;

                const list = dayDiv.querySelector('.sortable-list');
                
                day.items.forEach(item => {
                    const card = document.createElement('div');
                    card.dataset.id = item.id;
                    
                    if(item.type === 'transport') {
                        card.className = 'item-card type-transport';
                        card.innerHTML = `
                            <i class="fas fa-car" style="color:#f59e0b"></i>
                            <div style="flex:1">
                                <b>${item.from} ➔ ${item.to}</b>
                                <div style="font-size:0.8rem; opacity:0.8">${item.desc||''} (${item.dur||0}分)</div>
                            </div>
                            <i class="fas fa-trash" style="cursor:pointer; opacity:0.5" onclick="delItem(${idx}, '${item.id}')"></i>
                        `;
                    } else {
                        card.className = 'item-card';
                        card.innerHTML = `
                            <div style="font-family:monospace; color:var(--primary)">${item.time||'--:--'}</div>
                            <div style="flex:1"><b>${item.name}</b></div>
                            <i class="fas fa-trash" style="cursor:pointer; opacity:0.5" onclick="delItem(${idx}, '${item.id}')"></i>
                        `;
                        
                        if(item.lat) {
                            card.onclick = (e) => {
                                if(e.target.tagName !== 'I') {
                                    map.setView([item.lat, item.lng], 15);
                                    markers[item.id].openPopup();
                                }
                            };
                            const m = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name);
                            markers[item.id] = m;
                        }
                    }
                    list.appendChild(card);
                });

                new Sortable(list, { group: 'days', animation: 150, onEnd: handleSort });
                wrapper.appendChild(dayDiv);
            });
        }

        // --- Data Handling ---
        window.toggleDay = (idx) => {
            document.getElementById(`day-body-${idx}`).classList.toggle('collapsed');
        };

        window.updateDate = async (idx, val) => {
            tripData.days[idx].date = val;
            await saveTrip();
        };

        window.addDay = async () => {
            tripData.days.push({ id: generateSafeId(), date: '', items: [] });
            await saveTrip();
        };

        window.deleteDay = async (idx) => {
            if(confirm("確定刪除這整天？")) {
                tripData.days.splice(idx, 1);
                await saveTrip();
            }
        };

        window.delItem = async (dayIdx, itemId) => {
            if(confirm("刪除？")) {
                tripData.days[dayIdx].items = tripData.days[dayIdx].items.filter(i => i.id !== itemId);
                await saveTrip();
            }
        };

        async function handleSort() {
            const newDays = [];
            document.querySelectorAll('.sortable-list').forEach((list, dIdx) => {
                const oldDay = tripData.days[dIdx];
                const newItems = [];
                list.querySelectorAll('.item-card').forEach(card => {
                    const id = card.dataset.id;
                    let found = null;
                    tripData.days.forEach(d => {
                        const m = d.items.find(i => i.id === id);
                        if(m) found = m;
                    });
                    if(found) newItems.push(found);
                });
                newDays.push({ ...oldDay, items: newItems });
            });
            tripData.days = newDays;
            await saveTrip();
        }

        // --- Modal & Add ---
        window.openModal = (idx) => {
            targetDayIdx = idx;
            document.getElementById('modal-add').style.display = 'flex';
            // Reset inputs
            document.getElementById('inp-name').value = '';
            document.getElementById('inp-time').value = '';
            document.getElementById('trans-from').value = '';
            tempLoc = null;
        };

        window.closeModal = () => document.getElementById('modal-add').style.display = 'none';

        window.toggleType = (type) => {
            addType = type;
            document.querySelectorAll('.type-tab').forEach(e => e.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');
            
            document.getElementById('form-place').style.display = type === 'place' ? 'block' : 'none';
            document.getElementById('form-transport').style.display = type === 'transport' ? 'block' : 'none';
        };

        window.searchLoc = async () => {
            const name = document.getElementById('inp-name').value;
            if(!name) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}`);
                const data = await res.json();
                if(data.length > 0) {
                    tempLoc = { lat: data[0].lat, lng: data[0].lon };
                    alert("已定位");
                } else { alert("找不到"); }
            } catch(e) { alert("搜尋失敗"); }
        };

        window.confirmAdd = async () => {
            try {
                const newItem = { id: generateSafeId(), type: addType };
                
                if(addType === 'place') {
                    newItem.name = document.getElementById('inp-name').value;
                    newItem.time = document.getElementById('inp-time').value;
                    if(tempLoc) { newItem.lat = tempLoc.lat; newItem.lng = tempLoc.lng; }
                    if(!newItem.name) return alert("請輸入名稱");
                } else {
                    newItem.from = document.getElementById('trans-from').value;
                    newItem.to = document.getElementById('trans-to').value;
                    newItem.desc = document.getElementById('trans-desc').value;
                    newItem.dur = document.getElementById('trans-dur').value;
                    if(!newItem.from) return alert("請輸入出發地");
                }

                tripData.days[targetDayIdx].items.push(newItem);
                await saveTrip();
                closeModal();
            } catch(e) {
                alert("新增失敗: " + e.message);
            }
        };

        // --- Budget ---
        window.addExpense = async () => {
            const date = document.getElementById('bud-date').value || new Date().toISOString().split('T')[0];
            const item = document.getElementById('bud-item').value;
            const cost = parseInt(document.getElementById('bud-cost').value);
            const cat = document.getElementById('bud-cat').value;
            
            if(!item || !cost) return alert("請輸入完整");

            tripData.expenses.push({ id: generateSafeId(), date, item, cost, cat });
            await saveTrip();
            
            document.getElementById('bud-item').value = '';
            document.getElementById('bud-cost').value = '';
        };

        function renderBudget() {
            const list = document.getElementById('budget-list');
            list.innerHTML = '';
            let total = 0;
            const mapCat = { food: '🍜', transport: '🚗', shop: '🛍️', stay: '🏨', other: '✨' };

            (tripData.expenses || []).forEach(ex => {
                total += ex.cost;
                const div = document.createElement('div');
                div.style.cssText = "display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #374151; align-items:center;";
                div.innerHTML = `
                    <div>
                        <span style="color:var(--gray); font-size:0.8rem; margin-right:10px;">${ex.date}</span>
                        <span>${mapCat[ex.cat]||''} ${ex.item}</span>
                    </div>
                    <div>
                        <span style="color:var(--success); font-weight:bold; margin-right:10px;">$${ex.cost}</span>
                        <i class="fas fa-trash" style="cursor:pointer; color:var(--danger)" onclick="delExpense('${ex.id}')"></i>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('budget-total').innerText = `Total: $${total}`;
        }

        window.delExpense = async (id) => {
            if(confirm("刪除？")) {
                tripData.expenses = tripData.expenses.filter(e => e.id !== id);
                await saveTrip();
            }
        };

        // --- Utils ---
        function generateSafeId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        async function saveTrip() {
            await updateDoc(doc(db, "trips", currentTripId), { 
                days: tripData.days,
                expenses: tripData.expenses || []
            });
        }
        
        window.copyId = () => navigator.clipboard.writeText(currentTripId).then(()=>alert("已複製"));

    </script>
</body>
</html>
