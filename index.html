<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Travel Architect v8.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #111827; --card: #1f2937; --input-bg: #374151;
            --primary: #60a5fa; --text: #f3f4f6; --gray: #9ca3af;
            --danger: #ef4444; --success: #34d399;
            --transport-bg: #451a03; --transport-border: #f59e0b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- 導航列 --- */
        #navbar {
            height: 64px; background: #0f172a; border-bottom: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 50;
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .nav-right { display: flex; gap: 10px; }
        .trip-title-display { font-size: 1.2rem; font-weight: bold; color: #fff; }
        
        .nav-btn {
            background: transparent; border: none; color: var(--gray); font-size: 1rem;
            padding: 0 15px; height: 64px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 500;
        }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(59,130,246,0.1); }
        .nav-btn:hover { color: #fff; }

        /* --- 主容器 --- */
        #main-container { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* 行程列表 (左側) */
        #itinerary-container { 
            width: 480px; overflow-y: auto; padding: 20px; 
            background: var(--bg); border-right: 1px solid #334155;
            padding-bottom: 120px;
        }

        /* 天數卡片 */
        .day-container {
            background: var(--card); border: 1px solid #374151; border-radius: 10px;
            margin-bottom: 25px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .day-header {
            background: #111827; padding: 12px 15px; border-bottom: 1px solid #374151;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .day-title-group { display: flex; align-items: baseline; gap: 10px; }
        .day-idx { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .day-date { font-size: 0.95rem; color: #d1d5db; font-family: monospace; }
        
        .day-body { padding: 10px; min-height: 20px; transition: 0.3s; }
        .day-body.collapsed { display: none; }

        /* 行程項目卡片 */
        .item-card {
            background: #2d3748; padding: 12px; margin-bottom: 8px; border-radius: 8px;
            display: flex; gap: 12px; align-items: center; position: relative;
            border-left: 4px solid #718096; cursor: grab; transition: transform 0.1s;
        }
        .item-card:hover { transform: translateX(3px); background: #374151; }
        
        .item-time { 
            font-family: monospace; background: #1a202c; padding: 3px 6px; 
            border-radius: 4px; color: var(--primary); font-size: 0.85rem;
        }
        .item-content { flex: 1; }
        
        /* 交通卡片 */
        .item-card.type-transport {
            background: var(--transport-bg); border-left-color: var(--transport-border);
        }
        .item-card.type-transport .item-time { color: var(--transport-border); }

        /* 新增按鈕 */
        .btn-add-day {
            width: 100%; padding: 12px; background: #374151; border: none; color: #fff;
            border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-add-day:hover { background: #4b5563; }

        .btn-add-item {
            width: 100%; padding: 8px; background: transparent; border: 1px dashed #4b5563; 
            color: var(--gray); cursor: pointer; border-radius: 6px; margin-top: 5px; font-size: 0.9rem;
        }
        .btn-add-item:hover { background: rgba(255,255,255,0.05); color: var(--primary); border-color: var(--primary); }

        /* 地圖區域 */
        #map-wrapper { flex: 1; height: 100%; }
        #map { width: 100%; height: 100%; }

        /* 記帳頁面 */
        #view-budget { display: none; width: 100%; height: 100%; flex-direction: column; padding: 30px; align-items: center; overflow-y: auto; }
        .budget-panel { width: 100%; max-width: 800px; background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #374151; margin-bottom: 20px; }

        /* 彈窗 Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background: #1f2937; width: 450px; padding: 25px; border-radius: 12px;
            border: 1px solid #4b5563; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* 通用元件 */
        input, select {
            width: 100%; padding: 10px; margin-bottom: 12px;
            background: #111827; border: 1px solid #4b5563; color: #fff;
            border-radius: 6px; outline: none; font-size: 1rem;
        }
        input:focus { border-color: var(--primary); }
        label { display: block; margin-bottom: 5px; color: var(--gray); font-size: 0.9rem; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .btn-secondary { background: #374151; color: #fff; }

        /* 大廳 */
        #view-lobby { position: fixed; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .trip-card { width: 320px; background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 1px solid #374151; display:flex; justify-content:space-between; align-items:center;}
        .trip-card:hover { border-color: var(--primary); }

        /* 類型切換 */
        .type-switch { display: flex; gap: 10px; margin-bottom: 15px; background: #111827; padding: 5px; border-radius: 8px; }
        .type-opt { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-radius: 6px; color: var(--gray); }
        .type-opt.active { background: var(--primary); color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="view-lobby">
        <h1 style="color:var(--primary); margin-bottom:10px;">Travel Architect v8</h1>
        <div id="user-display" style="color:var(--gray); margin-bottom:30px;">Checking Login...</div>
        
        <div style="width:320px">
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px; padding:12px;" onclick="createNewTrip()">+ 建立新旅程</button>
            <div style="display:flex; gap:5px; margin-bottom:20px;">
                <input id="join-code" placeholder="輸入 ID 加入" style="margin:0;">
                <button class="btn btn-secondary" onclick="joinTrip()">加入</button>
            </div>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="navbar" style="display:none;">
        <div class="nav-left">
            <button class="btn btn-secondary" style="padding:5px 10px;" onclick="backToLobby()"><i class="fas fa-chevron-left"></i></button>
            <div>
                <div class="trip-title-display" id="nav-trip-title">載入中...</div>
                <div style="font-size:0.8rem; color:var(--gray); cursor:pointer;" onclick="copyId()" id="nav-trip-id">ID: ---</div>
            </div>
            <button class="btn btn-sm btn-secondary" onclick="openSettings()"><i class="fas fa-cog"></i> 設定</button>
        </div>
        <div class="nav-right">
            <button class="nav-btn active" onclick="switchTab('itinerary')">行程</button>
            <button class="nav-btn" onclick="switchTab('budget')">記帳</button>
        </div>
    </div>

    <div id="main-container" style="display:none;">
        
        <div id="view-itinerary" style="display:flex; width:100%;">
            <div id="itinerary-container">
                <div id="days-wrapper">
                    </div>
                <button class="btn-add-day" onclick="addDay()">
                    <i class="fas fa-calendar-plus"></i> 新增天數 (Add Day)
                </button>
            </div>
            <div id="map-wrapper">
                <div id="map"></div>
            </div>
        </div>

        <div id="view-budget">
            <div class="budget-panel">
                <h3 style="margin-top:0; border-bottom:1px solid #4b5563; padding-bottom:10px;">新增支出</h3>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>日期</label><input type="date" id="bud-date"></div>
                    <div style="flex:2"><label>項目</label><input id="bud-item" placeholder="早餐, 車票..."></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>金額</label><input type="number" id="bud-cost" placeholder="$"></div>
                    <div style="flex:1"><label>分類</label>
                        <select id="bud-cat">
                            <option value="food">🍜 食物</option>
                            <option value="trans">🚗 交通</option>
                            <option value="shop">🛍️ 購物</option>
                            <option value="stay">🏨 住宿</option>
                            <option value="other">✨ 其他</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addExpense()">記帳</button>
            </div>
            
            <div class="budget-panel" style="flex:1;">
                <div style="display:flex; justify-content:space-between;">
                    <h3>支出明細</h3>
                    <h3 style="color:var(--success)" id="budget-total">$0</h3>
                </div>
                <div id="budget-list"></div>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0;">旅程設定</h3>
            <label>旅程名稱</label>
            <input id="set-name">
            <label>出發日期 (設定後自動推算每天日期)</label>
            <input type="date" id="set-start-date">
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('modal-settings').style.display='none'">取消</button>
                <button class="btn btn-primary" style="flex:1" onclick="saveSettings()">儲存</button>
            </div>
            <hr style="border-color:#374151; margin:20px 0;">
            <button class="btn btn-danger" style="width:100%" onclick="deleteTrip()">刪除此旅程</button>
        </div>
    </div>

    <div id="modal-add" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0;">新增行程</h3>
            
            <div class="type-switch">
                <div class="type-opt active" id="type-place" onclick="setType('place')">📍 一般/景點</div>
                <div class="type-opt" id="type-transport" onclick="setType('transport')">🚄 交通移動</div>
            </div>

            <div id="form-place">
                <label>名稱</label>
                <input id="inp-name" placeholder="例: 淺草寺">
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>時間</label><input type="time" id="inp-time"></div>
                    <div style="flex:1; display:flex; align-items:flex-end;">
                        <button class="btn btn-secondary" style="width:100%; height:44px; margin-bottom:12px;" onclick="searchLoc()">🔍 定位</button>
                    </div>
                </div>
            </div>

            <div id="form-transport" style="display:none;">
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>出發</label><input id="trans-from"></div>
                    <div style="flex:1"><label>抵達</label><input id="trans-to"></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>方式</label><input id="trans-desc" placeholder="JR, 巴士..."></div>
                    <div style="flex:1"><label>耗時(分)</label><input type="number" id="trans-dur"></div>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-secondary" style="flex:1" onclick="closeAddModal()">取消</button>
                <button class="btn btn-primary" style="flex:1" onclick="confirmAdd()">加入</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBzNnKXVglsGckbt4YK1MzMUqEapXaMqNw",
          authDomain: "travel-plan-1.firebaseapp.com",
          projectId: "travel-plan-1",
          storageBucket: "travel-plan-1.firebasestorage.app",
          messagingSenderId: "623643684132",
          appId: "1:623643684132:web:214e3cdd6289b0056657b1",
          measurementId: "G-HLX5TQ4VMW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let user = null;
        let tripId = null;
        let tripData = null;
        let map = null;
        let markers = {};
        
        // State
        let targetDayIdx = 0;
        let addType = 'place';
        let tempLoc = null;

        // Auth
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('user-display').innerText = `Hi, ${u.displayName}`;
                loadLobby();
            } else {
                signInWithPopup(auth, provider);
            }
        });

        // Map
        function initMap() {
            if(map) return;
            map = L.map('map').setView([35.689, 139.692], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: 'OSM' }).addTo(map);
        }

        // Lobby
        function loadLobby() {
            document.getElementById('view-lobby').style.display = 'flex';
            document.getElementById('navbar').style.display = 'none';
            document.getElementById('main-container').style.display = 'none';
            
            const q = query(collection(db, "trips"), where("members", "array-contains", user.uid));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('lobby-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    const el = document.createElement('div');
                    el.className = 'trip-card';
                    el.innerHTML = `<div><b>${data.name}</b></div><div style="font-size:0.8rem; color:#9ca3af">${data.days.length} 天</div>`;
                    el.onclick = () => loadTrip(d.id);
                    list.appendChild(el);
                });
            });
        }

        window.createNewTrip = async () => {
            const name = prompt("旅程名稱:");
            if(!name) return;
            const newId = 'TRIP-' + Date.now().toString(36);
            await setDoc(doc(db, "trips", newId), {
                name, members: [user.uid],
                startDate: '', // New Field
                days: [{ id: 'd1', items: [] }],
                expenses: []
            });
        };

        window.joinTrip = async () => {
            const code = document.getElementById('join-code').value;
            if(!code) return;
            const ref = doc(db, "trips", code);
            const snap = await getDoc(ref);
            if(snap.exists()) {
                await updateDoc(ref, { members: arrayUnion(user.uid) });
                loadTrip(code);
            } else { alert("找不到 ID"); }
        };

        // Trip Logic
        function loadTrip(id) {
            tripId = id;
            document.getElementById('view-lobby').style.display = 'none';
            document.getElementById('navbar').style.display = 'flex';
            document.getElementById('main-container').style.display = 'flex';
            document.getElementById('nav-trip-id').innerText = `ID: ${id}`;
            
            initMap();
            setTimeout(() => map.invalidateSize(), 500);

            onSnapshot(doc(db, "trips", id), (snap) => {
                if(!snap.exists()) return loadLobby();
                tripData = snap.data();
                document.getElementById('nav-trip-title').innerText = tripData.name;
                renderItinerary();
                renderBudget();
            });
        }

        window.backToLobby = () => { tripId = null; loadLobby(); };
        window.switchTab = (tab) => {
            document.getElementById('view-itinerary').style.display = tab === 'itinerary' ? 'flex' : 'none';
            document.getElementById('view-budget').style.display = tab === 'budget' ? 'flex' : 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav-btn')[tab==='itinerary'?0:1].classList.add('active');
            if(tab === 'itinerary') map.invalidateSize();
        };

        // Date Calculation Helper
        function getCalcDate(startStr, dayOffset) {
            if(!startStr) return "";
            const d = new Date(startStr);
            d.setDate(d.getDate() + dayOffset);
            const weekDays = ["週日","週一","週二","週三","週四","週五","週六"];
            return `${d.toISOString().split('T')[0]} (${weekDays[d.getDay()]})`;
        }

        // Render Itinerary
        function renderItinerary() {
            const wrapper = document.getElementById('days-wrapper');
            wrapper.innerHTML = '';
            
            // Clear markers
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};

            const startDate = tripData.startDate || "";

            tripData.days.forEach((day, idx) => {
                const dateStr = getCalcDate(startDate, idx);
                
                const dayEl = document.createElement('div');
                dayEl.className = 'day-container';
                dayEl.innerHTML = `
                    <div class="day-header" onclick="toggleDayBody(${idx})">
                        <div class="day-title-group">
                            <span class="day-idx">Day ${idx+1}</span>
                            <span class="day-date">${dateStr}</span>
                        </div>
                        <button class="btn-sm btn-danger" onclick="deleteDay(${idx}); event.stopPropagation()">✕</button>
                    </div>
                    <div class="day-body" id="day-body-${idx}">
                        <div class="sortable-list" data-idx="${idx}"></div>
                        <button class="btn-add-item" onclick="openAddModal(${idx})">+ 新增項目</button>
                    </div>
                `;

                const list = dayEl.querySelector('.sortable-list');
                
                day.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = item.type === 'transport' ? 'item-card type-transport' : 'item-card';
                    card.dataset.id = item.id;
                    
                    if(item.type === 'transport') {
                        card.innerHTML = `
                            <i class="fas fa-car" style="color:#fbbf24"></i>
                            <div class="item-content">
                                <b>${item.from} ➔ ${item.to}</b>
                                <div style="font-size:0.8rem; opacity:0.8">${item.desc||''} (${item.dur||0}分)</div>
                            </div>
                            <i class="fas fa-times" onclick="delItem(${idx}, '${item.id}')" style="cursor:pointer; opacity:0.5"></i>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="item-time">${item.time || '--:--'}</div>
                            <div class="item-content"><b>${item.name}</b></div>
                            <i class="fas fa-times" onclick="delItem(${idx}, '${item.id}')" style="cursor:pointer; opacity:0.5"></i>
                        `;
                        if(item.lat) {
                            card.onclick = (e) => {
                                if(e.target.tagName!=='I') {
                                    map.setView([item.lat, item.lng], 15);
                                    markers[item.id].openPopup();
                                }
                            };
                            const m = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name);
                            markers[item.id] = m;
                        }
                    }
                    list.appendChild(card);
                });

                new Sortable(list, { group: 'shared', animation: 150, onEnd: handleSort });
                wrapper.appendChild(dayEl);
            });
        }

        window.toggleDayBody = (idx) => {
            document.getElementById(`day-body-${idx}`).classList.toggle('collapsed');
        };

        window.addDay = async () => {
            tripData.days.push({ id: Date.now().toString(), items: [] });
            await saveTrip();
        };

        window.deleteDay = async (idx) => {
            if(confirm("刪除這整天？")) {
                tripData.days.splice(idx, 1);
                await saveTrip();
            }
        };

        window.delItem = async (dayIdx, itemId) => {
            if(confirm("刪除此項目？")) {
                tripData.days[dayIdx].items = tripData.days[dayIdx].items.filter(i => i.id !== itemId);
                await saveTrip();
            }
        };

        async function handleSort() {
            const newDays = [];
            document.querySelectorAll('.sortable-list').forEach((list, dIdx) => {
                const oldDay = tripData.days[dIdx];
                const newItems = [];
                list.querySelectorAll('.item-card').forEach(card => {
                    const id = card.dataset.id;
                    let found = null;
                    tripData.days.forEach(d => {
                        const m = d.items.find(i => i.id === id);
                        if(m) found = m;
                    });
                    if(found) newItems.push(found);
                });
                newDays.push({ ...oldDay, items: newItems });
            });
            tripData.days = newDays;
            await saveTrip();
        }

        // Settings
        window.openSettings = () => {
            document.getElementById('set-name').value = tripData.name;
            document.getElementById('set-start-date').value = tripData.startDate || '';
            document.getElementById('modal-settings').style.display = 'flex';
        };

        window.saveSettings = async () => {
            const name = document.getElementById('set-name').value;
            const start = document.getElementById('set-start-date').value;
            await updateDoc(doc(db, "trips", tripId), { name: name, startDate: start });
            document.getElementById('modal-settings').style.display = 'none';
        };
        
        window.deleteTrip = async () => {
            if(confirm("確定刪除旅程？")) {
                await deleteDoc(doc(db, "trips", tripId));
                backToLobby();
            }
        };

        // Modal Add
        window.openAddModal = (idx) => {
            targetDayIdx = idx;
            document.getElementById('modal-add').style.display = 'flex';
            document.getElementById('inp-name').value = '';
            document.getElementById('inp-time').value = '';
            tempLoc = null;
        };
        window.closeAddModal = () => document.getElementById('modal-add').style.display = 'none';

        window.setType = (type) => {
            addType = type;
            document.querySelectorAll('.type-opt').forEach(e => e.classList.remove('active'));
            document.getElementById(`type-${type}`).classList.add('active');
            document.getElementById('form-place').style.display = type==='place'?'block':'none';
            document.getElementById('form-transport').style.display = type==='transport'?'block':'none';
        };

        window.searchLoc = async () => {
            const name = document.getElementById('inp-name').value;
            if(!name) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}`);
                const data = await res.json();
                if(data.length > 0) {
                    tempLoc = { lat: data[0].lat, lng: data[0].lon };
                    alert("已定位");
                } else { alert("找不到地點"); }
            } catch(e) { alert("Error"); }
        };

        window.confirmAdd = async () => {
            const newItem = { id: Date.now().toString(), type: addType };
            if(addType === 'place') {
                newItem.name = document.getElementById('inp-name').value;
                newItem.time = document.getElementById('inp-time').value;
                if(tempLoc) { newItem.lat = tempLoc.lat; newItem.lng = tempLoc.lng; }
                if(!newItem.name) return alert("請輸入名稱");
            } else {
                newItem.from = document.getElementById('trans-from').value;
                newItem.to = document.getElementById('trans-to').value;
                newItem.desc = document.getElementById('trans-desc').value;
                newItem.dur = document.getElementById('trans-dur').value;
                if(!newItem.from) return alert("請輸入出發地");
            }
            tripData.days[targetDayIdx].items.push(newItem);
            await saveTrip();
            closeAddModal();
        };

        // Budget
        window.addExpense = async () => {
            const date = document.getElementById('bud-date').value || new Date().toISOString().split('T')[0];
            const item = document.getElementById('bud-item').value;
            const cost = parseInt(document.getElementById('bud-cost').value);
            const cat = document.getElementById('bud-cat').value;
            if(!item || !cost) return;
            tripData.expenses.push({ id: Date.now().toString(), date, item, cost, cat });
            await saveTrip();
            document.getElementById('bud-item').value = '';
            document.getElementById('bud-cost').value = '';
        };

        function renderBudget() {
            const list = document.getElementById('budget-list');
            list.innerHTML = '';
            let total = 0;
            const cats = { food:'🍜', trans:'🚗', shop:'🛍️', stay:'🏨', other:'✨' };
            (tripData.expenses||[]).forEach(ex => {
                total += ex.cost;
                const d = document.createElement('div');
                d.style.cssText = "display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #374151";
                d.innerHTML = `<div>${ex.date} ${cats[ex.cat]||''} ${ex.item}</div><div><b style="color:#34d399">$${ex.cost}</b> <i class="fas fa-trash" onclick="delExp('${ex.id}')" style="cursor:pointer;color:#ef4444;margin-left:10px"></i></div>`;
                list.appendChild(d);
            });
            document.getElementById('budget-total').innerText = `$${total}`;
        }
        window.delExp = async(id)=>{ if(confirm('刪除?')) { tripData.expenses=tripData.expenses.filter(e=>e.id!==id); await saveTrip(); }};

        async function saveTrip() {
            await updateDoc(doc(db, "trips", tripId), { days: tripData.days, expenses: tripData.expenses, startDate: tripData.startDate||'' });
        }
        window.copyId = () => navigator.clipboard.writeText(tripId).then(()=>alert("ID Copied"));

    </script>
</body>
</html>
